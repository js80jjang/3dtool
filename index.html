<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>3D 주방 플래너</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e1117;font-family:'Segoe UI',sans-serif;overflow:hidden}
#ui{position:fixed;top:12px;left:12px;z-index:10;background:rgba(5,7,16,.90);
  backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);
  border-radius:16px;padding:14px 16px;color:#fff;width:226px;
  max-height:calc(100vh - 24px);overflow-y:auto}
.sec{font-size:9px;font-weight:700;letter-spacing:1.3px;color:#6ab0cc;
  text-transform:uppercase;margin:12px 0 6px}
.sec:first-child{margin-top:0}
.badge{background:rgba(106,176,204,.10);border:1px solid rgba(106,176,204,.20);
  border-radius:7px;padding:6px 9px;font-size:10px;color:#9ed0e4;margin-bottom:3px;line-height:1.7}
.lrow{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.lbtn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  color:#888;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:9.5px;
  font-weight:600;transition:all .14s;text-align:center;line-height:1.5}
.lbtn:hover{background:rgba(255,255,255,.10);color:#ccc}
.lbtn.active{background:rgba(37,99,235,.45);border-color:#4a8fff;color:#fff}
.lbtn .ic{font-size:16px;display:block;margin-bottom:1px}
.trow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tbtn{width:34px;height:34px;border-radius:6px;border:2px solid rgba(255,255,255,.10);
  cursor:pointer;transition:all .14s;background-size:cover;position:relative}
.tbtn:hover{transform:scale(1.08);border-color:rgba(255,255,255,.28)}
.tbtn.active{border-color:#fff}
.tbtn span{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);
  font-size:8px;color:#555;white-space:nowrap}
.crow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.cbtn{width:21px;height:21px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .14s}
.cbtn:hover{transform:scale(1.14)}
.cbtn.active{border-color:#fff;transform:scale(1.18)}
.vrow{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.vbtn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  color:#777;padding:5px 3px;border-radius:6px;cursor:pointer;font-size:9.5px;
  transition:all .14s;text-align:center}
.vbtn:hover{background:rgba(255,255,255,.12);color:#fff}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.25);font-size:11px;pointer-events:none;
  background:rgba(0,0,0,.45);padding:4px 12px;border-radius:16px}
#err{display:none;position:fixed;top:0;left:0;width:100%;background:rgba(20,20,20,.97);
  color:#fff;padding:24px 28px;font-size:14px;font-family:'Segoe UI',sans-serif;z-index:999;line-height:1.8}
#err b{color:#ffd54f}
</style>
</head>
<body>
<div id="ui">
  <div class="sec">주방 유형</div>
  <div class="lrow">
    <button class="lbtn active" id="btn-I" onclick="setLayout('I')"><span class="ic">▬</span>일자형<br><small style="color:#555;font-size:8px">20~30평</small></button>
    <button class="lbtn" id="btn-L" onclick="setLayout('L')"><span class="ic">⌐</span>ㄱ자형<br><small style="color:#555;font-size:8px">30평대</small></button>
    <button class="lbtn" id="btn-U" onclick="setLayout('U')"><span class="ic">⊏</span>ㄷ자형<br><small style="color:#555;font-size:8px">40평+</small></button>
    <button class="lbtn" id="btn-G" onclick="setLayout('G')"><span class="ic">⊟</span>아일랜드<br><small style="color:#555;font-size:8px">대면형</small></button>
  </div>
  <div id="layout-info" class="badge" style="margin-top:7px">20~30평 · 화이트 미니멀</div>

  <div class="sec">상판 소재</div>
  <div class="trow" id="ctr-row"></div>

  <div class="sec">백스플래시</div>
  <div class="trow" id="mid-row"></div>

  <div class="sec">하부장 색상</div>
  <div class="crow" id="cab-col">
    <div class="cbtn active" data-g="cab" data-c="0xf2f2f0" style="background:#f2f2f0"></div>
    <div class="cbtn" data-g="cab" data-c="0x4a4b4d" style="background:#4a4b4d"></div>
    <div class="cbtn" data-g="cab" data-c="0xe8e0d0" style="background:#e8e0d0"></div>
    <div class="cbtn" data-g="cab" data-c="0x2e3a2a" style="background:#2e3a2a"></div>
    <div class="cbtn" data-g="cab" data-c="0x1e2d4a" style="background:#1e2d4a"></div>
  </div>

  <div class="sec">상부장 색상</div>
  <div class="crow" id="upp-col">
    <div class="cbtn active" data-g="upp" data-c="0xf2f2f0" style="background:#f2f2f0"></div>
    <div class="cbtn" data-g="upp" data-c="0x4a4b4d" style="background:#4a4b4d"></div>
    <div class="cbtn" data-g="upp" data-c="0xe0ddd6" style="background:#e0ddd6"></div>
    <div class="cbtn" data-g="upp" data-c="0x2e3a2a" style="background:#2e3a2a"></div>
    <div class="cbtn" data-g="upp" data-c="0x1e2d4a" style="background:#1e2d4a"></div>
  </div>

  <div class="sec">카메라</div>
  <div class="vrow">
    <button class="vbtn" onclick="setView('persp')">🔄 퍼스펙티브</button>
    <button class="vbtn" onclick="setView('front')">⬜ 정면</button>
    <button class="vbtn" onclick="setView('top')">⬆️ 평면</button>
    <button class="vbtn" onclick="setView('side')">◀️ 측면</button>
  </div>
</div>
<div id="hint">드래그: 회전 &nbsp;|&nbsp; 스크롤: 줌 &nbsp;|&nbsp; 우클릭: 이동</div>
<div id="err"></div>

<script>
// ── CDN 로딩 (fetch+blob 우회) ─────────────────────────
(function() {
  var CDNS = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];

  function showError() {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.innerHTML =
      '<b>⚠️ Three.js 로드 실패 (Cowork 내부 프리뷰)</b><br><br>' +
      '이 파일은 외부 라이브러리가 필요합니다.<br>' +
      '상단의 <b>"Google Chrome에서 열기"</b> 버튼을 클릭하면 정상 동작합니다.';
  }

  function loadViaBlob(url, onOK, onFail) {
    fetch(url)
      .then(function(r) { return r.blob(); })
      .then(function(blob) {
        var burl = URL.createObjectURL(blob);
        var s = document.createElement('script');
        s.src = burl;
        s.onload = function() { URL.revokeObjectURL(burl); onOK(); };
        s.onerror = onFail;
        document.head.appendChild(s);
      })
      .catch(onFail);
  }

  function tryLoad(i) {
    if (i >= CDNS.length) { showError(); return; }
    var s = document.createElement('script');
    s.src = CDNS[i];
    s.onload = function() { initApp(); };
    s.onerror = function() {
      loadViaBlob(CDNS[i], initApp, function() { tryLoad(i + 1); });
    };
    document.head.appendChild(s);
  }

  tryLoad(0);
})();

function initApp() {

// ── Error display ──────────────────────────────────────
window.onerror = function(msg, src, line, col, err) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.innerHTML = '<b>JS ERROR:</b> ' + msg + '<br>Line: ' + line;
};

// ── Renderer ───────────────────────────────────────────
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Scene ──────────────────────────────────────────────
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1117);
scene.fog = new THREE.Fog(0x0e1117, 22, 45);

// ── Camera ─────────────────────────────────────────────
var camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 80);

// ── Lights ─────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff8f0, 0.65));
var sun = new THREE.DirectionalLight(0xfff4e0, 0.85);
sun.position.set(6, 14, 8);
sun.castShadow = true;
sun.shadow.mapSize.width = sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 40;
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
scene.add(sun);
var ptA = new THREE.PointLight(0xd8e8ff, 0.25, 22); ptA.position.set(-6, 5, 5); scene.add(ptA);
var ptB = new THREE.PointLight(0xfff0d8, 0.20, 22); ptB.position.set(6, 5, 5); scene.add(ptB);

// ── Texture helpers ────────────────────────────────────
function makeTex(fn, sz) {
  sz = sz || 512;
  var c = document.createElement('canvas');
  c.width = c.height = sz;
  fn(c.getContext('2d'), sz);
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function prevURL(fn) {
  var c = document.createElement('canvas');
  c.width = c.height = 64;
  fn(c.getContext('2d'), 64);
  return c.toDataURL();
}

// ── Draw functions ─────────────────────────────────────
function dWoodOak(ctx, s) {
  var g = ctx.createLinearGradient(0,0,s,0);
  g.addColorStop(0,'#c8986a'); g.addColorStop(0.5,'#b8885a'); g.addColorStop(1,'#c8986a');
  ctx.fillStyle = g; ctx.fillRect(0,0,s,s);
  for (var i = 0; i < 45; i++) {
    var y = Math.random()*s, v = Math.random()*20-10;
    ctx.strokeStyle = 'rgba('+(155+v|0)+','+(100+v|0)+','+(55+v|0)+','+(0.10+Math.random()*0.18)+')';
    ctx.lineWidth = Math.random()*2+0.4;
    ctx.beginPath(); ctx.moveTo(0,y);
    var px = 0, py = y;
    while (px < s) { px += Math.random()*22+8; py += Math.random()*8-4; ctx.lineTo(px,py); }
    ctx.stroke();
  }
}
function dMarbleWhite(ctx, s) {
  var g = ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#f4f1ee'); g.addColorStop(1,'#eae6e0');
  ctx.fillStyle = g; ctx.fillRect(0,0,s,s);
  for (var i = 0; i < 18; i++) {
    ctx.save();
    ctx.strokeStyle = 'rgba(185,175,162,'+(0.10+Math.random()*0.20)+')';
    ctx.lineWidth = Math.random()*2.5+0.5;
    ctx.beginPath();
    var x = Math.random()*s, y = Math.random()*s; ctx.moveTo(x,y);
    for (var j = 0; j < 6; j++) { x += Math.random()*60-30; y += Math.random()*38-14; ctx.bezierCurveTo(x+28,y+20,x-20,y+24,x,y); }
    ctx.stroke(); ctx.restore();
  }
}
function dSlate(ctx, s) {
  ctx.fillStyle = '#383838'; ctx.fillRect(0,0,s,s);
  for (var i = 0; i < 3000; i++) {
    var v = Math.random()*24-12;
    ctx.fillStyle = 'rgba('+(58+v|0)+','+(58+v|0)+','+(58+v|0)+','+Math.random()*0.12+')';
    ctx.fillRect(Math.random()*s, Math.random()*s, Math.random()*3+1, Math.random()*3+1);
  }
}
function dQuartz(ctx, s) {
  ctx.fillStyle = '#eeebe6'; ctx.fillRect(0,0,s,s);
  for (var i = 0; i < 4000; i++) {
    var v = Math.random()*20-10;
    ctx.fillStyle = 'rgba('+(215+v|0)+','+(210+v|0)+','+(202+v|0)+','+Math.random()*0.08+')';
    ctx.fillRect(Math.random()*s, Math.random()*s, Math.random()*2.5+1, Math.random()*2.5+1);
  }
}
function dSubway(ctx, s) {
  var W = Math.floor(s/5), H = Math.floor(s/3), G = Math.max(1, Math.floor(s/90));
  ctx.fillStyle = '#c4c4c0'; ctx.fillRect(0,0,s,s);
  for (var r = 0; r < Math.ceil(s/H)+1; r++) {
    var off = (r%2)*(W/2);
    for (var c = -1; c < Math.ceil(s/W)+1; c++) {
      var v = Math.random()*8-4;
      ctx.fillStyle = 'rgb('+(246+v|0)+','+(246+v|0)+','+(244+v|0)+')';
      ctx.fillRect(c*W+off+G, r*H+G, W-G*2, H-G*2);
    }
  }
}
function dHerringbone(ctx, s) {
  var L = Math.floor(s/4), Wt = Math.floor(L/2), G = Math.max(1, Math.floor(s/100));
  ctx.fillStyle = '#c0c0bc'; ctx.fillRect(0,0,s,s);
  var step = Math.floor(s/9);
  for (var r = -3; r < 18; r++) {
    for (var c = -3; c < 18; c++) {
      ctx.save();
      ctx.translate(c*step + r*step*0.5, r*step*0.6);
      ctx.rotate((c%2===0) ? Math.PI/4 : -Math.PI/4);
      var v = Math.random()*8-4;
      ctx.fillStyle = 'rgb('+(242+v|0)+','+(242+v|0)+','+(240+v|0)+')';
      ctx.fillRect(-L/2+G, -Wt/2+G, L-G*2, Wt-G*2);
      ctx.restore();
    }
  }
}
function dMarbleTile(ctx, s) {
  var T = Math.floor(s/2), G = Math.max(2, Math.floor(s/80));
  ctx.fillStyle = '#b0aaa4'; ctx.fillRect(0,0,s,s);
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {
    var v = Math.random()*14-7;
    ctx.fillStyle = 'rgb('+(238+v|0)+','+(234+v|0)+','+(228+v|0)+')';
    ctx.fillRect(c*T+G, r*T+G, T-G*2, T-G*2);
  }
}
function dLargeTile(ctx, s) {
  var T = Math.floor(s/2), G = Math.max(3, Math.floor(s/60));
  ctx.fillStyle = '#9c9890'; ctx.fillRect(0,0,s,s);
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {
    var v = Math.random()*12-6;
    ctx.fillStyle = 'rgb('+(224+v|0)+','+(218+v|0)+','+(208+v|0)+')';
    ctx.fillRect(c*T+G, r*T+G, T-G*2, T-G*2);
  }
}
function dWoodFloor(ctx, s) {
  var pH = Math.floor(s/7);
  var offs = [0, Math.floor(s/3), Math.floor(2*s/3)];
  for (var row = 0; row < 9; row++) {
    var off = offs[row%3];
    for (var col = -1; col < 3; col++) {
      var x = col*(s>>1)+off+1, y = row*pH+1;
      var v = Math.random()*20-10;
      ctx.fillStyle = 'rgb('+(195+v|0)+','+(158+v|0)+','+(108+v|0)+')';
      ctx.fillRect(x, y, (s>>1)-2, pH-2);
      ctx.strokeStyle = 'rgba('+(165+v|0)+','+(128+v|0)+','+(80+v|0)+',.22)';
      ctx.lineWidth = 0.5;
      for (var g = 1; g < 4; g++) {
        ctx.beginPath(); ctx.moveTo(x, y+pH*g/4); ctx.lineTo(x+(s>>1)-2, y+pH*g/4+Math.random()*3-1.5); ctx.stroke();
      }
    }
  }
}
function dWalnut(ctx, s) {
  ctx.fillStyle = '#4a2e14'; ctx.fillRect(0,0,s,s);
  for (var i = 0; i < 40; i++) {
    var y = Math.random()*s, v = Math.random()*15-8;
    ctx.strokeStyle = 'rgba('+(68+v|0)+','+(44+v|0)+','+(22+v|0)+','+(0.15+Math.random()*0.20)+')';
    ctx.lineWidth = Math.random()*2+0.4;
    ctx.beginPath(); ctx.moveTo(0,y);
    var px = 0, py = y;
    while (px < s) { px += Math.random()*18+8; py += Math.random()*7-3.5; ctx.lineTo(px,py); }
    ctx.stroke();
  }
}

// ── Texture defs ───────────────────────────────────────
var CTR_DEFS = [
  {name:'원목', fn:dWoodOak, rep:[1.5,0.5]},
  {name:'화이트 마블', fn:dMarbleWhite, rep:[1.5,0.5]},
  {name:'다크 슬레이트', fn:dSlate, rep:[2,0.8]},
  {name:'화이트 쿼츠', fn:dQuartz, rep:[2,0.8]}
];
var MID_DEFS = [
  {name:'서브웨이', fn:dSubway, rep:[5,3]},
  {name:'헤링본', fn:dHerringbone, rep:[4,3]},
  {name:'마블 타일', fn:dMarbleTile, rep:[3,2]},
  {name:'대형 타일', fn:dLargeTile, rep:[3,2]}
];

// ── Materials (ALL plain colors — no canvas at init) ───
var M = {
  tok:    new THREE.MeshLambertMaterial({color:0x141414}),
  hdl:    new THREE.MeshLambertMaterial({color:0xb0b8c0}),
  brass:  new THREE.MeshLambertMaterial({color:0xb89440}),
  stl:    new THREE.MeshLambertMaterial({color:0xaab0b8}),
  stlDk:  new THREE.MeshLambertMaterial({color:0x888e96}),
  blk:    new THREE.MeshLambertMaterial({color:0x141414}),
  bGls:   new THREE.MeshLambertMaterial({color:0x0c0c0c}),
  knb:    new THREE.MeshLambertMaterial({color:0x484848}),
  snkB:   new THREE.MeshLambertMaterial({color:0x808890}),
  snkI:   new THREE.MeshLambertMaterial({color:0x585e64}),
  wnd:    new THREE.MeshLambertMaterial({color:0xd8eeff, transparent:true, opacity:0.32}),
  wndF:   new THREE.MeshLambertMaterial({color:0xf0f0f0}),
  wood:   new THREE.MeshLambertMaterial({color:0xb08050}),
  woodDk: new THREE.MeshLambertMaterial({color:0x806030}),
  chr:    new THREE.MeshLambertMaterial({color:0xa07848}),
  chrDk:  new THREE.MeshLambertMaterial({color:0x786040}),
  grn:    new THREE.MeshLambertMaterial({color:0x4a8850}),
  wal:    new THREE.MeshLambertMaterial({color:0xf2ede4}),
  walS:   new THREE.MeshLambertMaterial({color:0xede8df}),
  ctr:    new THREE.MeshLambertMaterial({color:0xc8a870}),
  mid:    new THREE.MeshLambertMaterial({color:0xe8e8e4}),
  flo:    new THREE.MeshLambertMaterial({color:0xc8a070}),
  cab:    new THREE.MeshLambertMaterial({color:0xf2f2f0}),
  cabDk:  new THREE.MeshLambertMaterial({color:0xe0e0de}),
  upp:    new THREE.MeshLambertMaterial({color:0xf2f2f0}),
  uppDk:  new THREE.MeshLambertMaterial({color:0xe0e0de}),
  wlt:    new THREE.MeshLambertMaterial({color:0x5c3d22}),
  wltDk:  new THREE.MeshLambertMaterial({color:0x4a2e14}),
  gray:   new THREE.MeshLambertMaterial({color:0x4a4b4d}),
  grayDk: new THREE.MeshLambertMaterial({color:0x363738}),
  grayLt: new THREE.MeshLambertMaterial({color:0x5e5f61}),
  frg:    new THREE.MeshLambertMaterial({color:0xd8dadc}),
  frgDk:  new THREE.MeshLambertMaterial({color:0xbbbdbe}),
  frgWht: new THREE.MeshLambertMaterial({color:0xf0f0ee}),
  frgBlk: new THREE.MeshLambertMaterial({color:0x1a1a1a}),
  red:    new THREE.MeshLambertMaterial({color:0xc03828}),
  yel:    new THREE.MeshLambertMaterial({color:0xd8b030})
};

// ── Apply textures AFTER materials created ─────────────
(function(){
  var ft = makeTex(dWoodFloor, 512); ft.repeat.set(6, 10);
  M.flo.map = ft; M.flo.needsUpdate = true;
  var wt = makeTex(dWalnut, 512); wt.repeat.set(0.5, 1);
  M.wlt.map = wt; M.wlt.needsUpdate = true;
  M.wltDk.map = wt; M.wltDk.needsUpdate = true;
})();

function applyCounterTex(i) {
  var d = CTR_DEFS[i], t = makeTex(d.fn); t.repeat.set(d.rep[0], d.rep[1]);
  M.ctr.map = t; M.ctr.needsUpdate = true;
}
function applyMidwayTex(i) {
  var d = MID_DEFS[i], t = makeTex(d.fn); t.repeat.set(d.rep[0], d.rep[1]);
  M.mid.map = t; M.mid.needsUpdate = true;
}
applyCounterTex(0);
applyMidwayTex(0);

// ── Groups ─────────────────────────────────────────────
var kGrp = new THREE.Group(); scene.add(kGrp);
var wGrp = new THREE.Group(); scene.add(wGrp);
var dynLights = [];

function clearScene() {
  while (kGrp.children.length) kGrp.remove(kGrp.children[0]);
  while (wGrp.children.length) wGrp.remove(wGrp.children[0]);
  for (var i = 0; i < dynLights.length; i++) scene.remove(dynLights[i]);
  dynLights = [];
}

// ── Primitives ─────────────────────────────────────────
function B(w,h,d,mat,x,y,z) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  kGrp.add(m); return m;
}
function C(rt,rb,h,seg,mat,x,y,z) {
  var m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = true; kGrp.add(m); return m;
}
function W(w,h,d,mat,x,y,z) {

// ── Layout switch ──────────────────────────────────────
var INFOS={I:'20~30평 · 화이트 미니멀 / 일자형',L:'30평대 · 월넛+화이트 / ㄱ자형',U:'40평+ · 다크그레이 쉐이커 / ㄷ자형',G:'대면형 아일랜드 · 월넛+마블'};
function setLayout(t) {
  document.querySelectorAll('.lbtn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('btn-'+t).classList.add('active');
  document.getElementById('layout-info').textContent=INFOS[t];
  if(t==='I'){buildI();setView('persp');}
  if(t==='L'){buildL();setView('persp');}
  if(t==='U'){buildU();setView('top');}
  if(t==='G'){buildG();setView('persp');}
}
window.setLayout=setLayout;

// ── Texture UI ─────────────────────────────────────────
function makeTexRow(defs,id,fn) {
  var row=document.getElementById(id);
  defs.forEach(function(d,i){
    var btn=document.createElement('div');
    btn.className='tbtn'+(i===0?' active':'');
    btn.title=d.name;
    btn.style.backgroundImage='url('+prevURL(d.fn)+')';
    var sp=document.createElement('span'); sp.textContent=d.name; btn.appendChild(sp);
    btn.onclick=function(){
      row.querySelectorAll('.tbtn').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active'); fn(i);
    };
    row.appendChild(btn);
  });
}
makeTexRow(CTR_DEFS,'ctr-row',applyCounterTex);
makeTexRow(MID_DEFS,'mid-row',applyMidwayTex);

// ── Color controls ─────────────────────────────────────
document.querySelectorAll('.cbtn').forEach(function(btn){
  btn.addEventListener('click',function(){
    var g=btn.dataset.g, hex=parseInt(btn.dataset.c);
    document.querySelectorAll('[data-g="'+g+'"]').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    if(g==='cab'){M.cab.color.setHex(hex);M.cabDk.color.setHex(hex);}
    if(g==='upp'){M.upp.color.setHex(hex);M.uppDk.color.setHex(hex);}
  });
});

// ── Camera orbit ───────────────────────────────────────
var drag=false, rdrag=false, lx=0, ly=0;
var th=0.50, ph=0.46, rad=13, px=0, py=1.1;
var tTh=th, tPh=ph, tRad=rad, tPx=px, tPy=py;

renderer.domElement.addEventListener('mousedown',function(e){drag=true;rdrag=e.button===2;lx=e.clientX;ly=e.clientY;});
renderer.domElement.addEventListener('contextmenu',function(e){e.preventDefault();});
renderer.domElement.addEventListener('mousemove',function(e){
  if(!drag)return;
  var dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if(rdrag){tPx-=dx*0.013;tPy+=dy*0.013;}else{tTh-=dx*0.004;tPh=Math.max(0.06,Math.min(1.44,tPh+dy*0.004));}
});
renderer.domElement.addEventListener('mouseup',function(){drag=false;});
renderer.domElement.addEventListener('wheel',function(e){tRad=Math.max(3,Math.min(24,tRad+e.deltaY*0.012));},{passive:true});

var ltd=0;
renderer.domElement.addEventListener('touchstart',function(e){
  if(e.touches.length===1){drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
  else if(e.touches.length===2) ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
});
renderer.domElement.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===1&&drag){var dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;tTh-=dx*0.004;tPh=Math.max(0.06,Math.min(1.44,tPh+dy*0.004));}
  else if(e.touches.length===2){var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);tRad=Math.max(3,Math.min(24,tRad-(d-ltd)*0.016));ltd=d;}
},{passive:false});
renderer.domElement.addEventListener('touchend',function(){drag=false;});

function setView(v){
  if(v==='persp'){tTh=0.50;tPh=0.44;tRad=13;tPx=0;tPy=1.1;}
  if(v==='front'){tTh=0;   tPh=0.22;tRad=11;tPx=0;tPy=1.1;}
  if(v==='top')  {tTh=0;   tPh=0.03;tRad=14;tPx=0;tPy=0;}
  if(v==='side') {tTh=Math.PI/2;tPh=0.36;tRad=11;tPx=0;tPy=1.1;}
}
window.setView=setView;

window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ── Render loop ────────────────────────────────────────
(function loop(){
  requestAnimationFrame(loop);
  var s=0.08;
  th+=(tTh-th)*s; ph+=(tPh-ph)*s; rad+=(tRad-rad)*s; px+=(tPx-px)*s; py+=(tPy-py)*s;
  camera.position.set(
    px+rad*Math.sin(ph)*Math.sin(th),
    py+rad*Math.cos(ph),
       rad*Math.sin(ph)*Math.cos(th)
  );
  camera.lookAt(px,py,0);
  renderer.render(scene,camera);
})();

// ── Init ───────────────────────────────────────────────
buildI();
setView('persp');

} // end initApp
